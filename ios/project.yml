# Proyecto de Xcode descrito como texto. GitHub Actions lo convierte con XcodeGen:
#   xcodegen generate
name: Jarvis
options:
  bundleIdPrefix: com.raldita10
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.1.0
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Jarvis]
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raldita10.jarvis
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/Jarvis.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
